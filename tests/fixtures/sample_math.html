<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>D - Math Sample</title></head>
<body>
<div id="task-statement">
	<span class="lang-ja">
		<div class="part"><section>
			<h3>問題文</h3>
			<p>長さ <var>N</var> の文字列 <var>S</var> が与えられます。条件 <var>1 \leq i \leq N</var> を満たす添字について考えます。</p>
		</section></div>
		<div class="part"><section>
			<h3>制約</h3>
			<ul>
				<li><var>1 \leq N \leq 2 \times 10^5</var></li>
				<li><var>S</var> は長さ <var>N</var> の文字列</li>
				<li><var>N</var> は整数</li>
			</ul>
		</section></div>
		<div class="part"><section>
			<h3>入力例 1</h3>
			<pre>6
ABABBA
</pre>
		</section></div>
		<div class="part"><section>
			<h3>出力例 1</h3>
			<pre>3
</pre>
		</section></div>
	</span>
</div>
</body>
</html>
